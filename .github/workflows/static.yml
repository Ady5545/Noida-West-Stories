# Build and deploy Noida West Stories to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Greater Noida West road data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/data
          QUERY='[out:json][timeout:90];
          (
            way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service)$"](28.565,77.390,28.645,77.490);
          );
          out geom;'
          for ENDPOINT in "https://overpass-api.de/api/interpreter" "https://overpass.kumi.systems/api/interpreter"; do
            echo "Trying ${ENDPOINT}"
            if curl --fail --retry 3 --retry-delay 2 --get \
              --data-urlencode "data=${QUERY}" \
              "${ENDPOINT}" > src/data/osm-roads.json; then
              test -s src/data/osm-roads.json
              echo "OSM road data downloaded."
              break
            fi
          done
          test -s src/data/osm-roads.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
